name: One-time PR integration and release contract verification
on:
  push:
    branches: [codex/integration-all-prs-20261027]
    paths:
      - .github/workflows/integration-all-prs-once.yml
permissions:
  contents: write
concurrency:
  group: tianming-integration-all-prs-20261027
  cancel-in-progress: false
jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge all requested branches without hidden conflict resolution
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for ref in \
            codex/modern-chinese-prompts-20261016 \
            codex/npc-daily-inbox-20261016 \
            codex/diplomacy-war-actions-20261016 \
            codex/gemini-web-free-desktop-20261017 \
            codex/fix-npc-silence-api-pool-20261018 \
            codex/war-captives-20261026 \
            codex/modular-living-world-20261027
          do
            echo "::group::Merge $ref"
            git fetch origin "refs/heads/$ref:refs/remotes/origin/$ref"
            if ! git merge --no-ff --no-edit "origin/$ref"; then
              # The Gemini PR4 branch includes PR1's modern-language rules plus extra dialogue safeguards.
              # Resolve ONLY these nine reviewed overlapping files in favor of the newer PR4 version.
              if [[ "$ref" == "codex/gemini-web-free-desktop-20261017" ]]; then
                for file in \
                  web/scripts/smoke-agent-mode-d2d3.js \
                  web/scripts/smoke-edict-narrative-link.js \
                  web/scripts/smoke-modern-chinese-prompts.js \
                  web/tm-chaoyi-changchao-adapter.js \
                  web/tm-chaoyi-tinyi.js \
                  web/tm-chaoyi-yuqian.js \
                  web/tm-hongyan-office.js \
                  web/tm-prompt-composer.js \
                  web/tm-wendui-persona-views.js
                do
                  if git ls-files -u -- "$file" | grep -q .; then
                    git checkout --theirs -- "$file"
                    git add "$file"
                    echo "Reviewed overlap: $file retained newer PR4 language and test rules"
                  fi
                done
              fi
              if [[ "$ref" == "codex/fix-npc-silence-api-pool-20261018" ]]; then
                # Both files are byte-derived runtime manifests, never source of truth.
                for file in web/startup-script-phases.json web/tm-start-runtime-manifest.json; do
                  if git ls-files -u -- "$file" | grep -q .; then
                    git checkout --theirs -- "$file"
                    git add "$file"
                    echo "Temporarily selected latest derived manifest $file; regenerate from final combined source below"
                  fi
                done
              fi
              if [[ "$ref" == "codex/war-captives-20261026" ]]; then
                # PR4's avatar and PR7's captive action both modify the dossier.
                for file in web/index.html web/tm-renwu-tuzhi.js; do
                  if git ls-files -u -- "$file" | grep -q .; then
                    git checkout --ours -- "$file"
                    git add "$file"
                  fi
                done
                node - <<'NODE'
          const fs=require('fs');
          const a='web/index.html',b='web/tm-renwu-tuzhi.js';
          let html=fs.readFileSync(a,'utf8');
          const script='<script src="tm-war-captives.js?v=20261026-war-captives"></script>';
          const anchor='<script src="tm-renwu-tuzhi.js?v=20260928-release1353"></script>';
          if (!html.includes(script)) {
          if (!html.includes(anchor)) throw Error('dossier script anchor missing');
          html=html.replace(anchor,script+'\n'+anchor);
          fs.writeFileSync(a,html);
          }
          let js=fs.readFileSync(b,'utf8');
          const old="  return livingActions(p,false)+_del;";
          const next="  return livingActions(p,false)+(window.TM&&TM.WarCaptives&&TM.WarCaptives.canManage(p.name)?'<button class=\"dact primary\" onclick=\"TM.WarCaptives.open(TMZhi.selectedName())\">战俘处置</button>':'')+_del;";
          if (!js.includes('TM.WarCaptives.canManage(p.name)')) {
          if(!js.includes(old))throw Error('headActs source anchor missing');
          js=js.replace(old,next);
          }
          fs.writeFileSync(b,js);
          NODE
                git add web/index.html web/tm-renwu-tuzhi.js
              fi
              unresolved="$(git diff --name-only --diff-filter=U)"
              if [[ -n "$unresolved" ]]; then
                echo "::error::Unreviewed conflicts in $ref; refusing to overwrite"
                echo "$unresolved"
                exit 1
              fi
              # Existing upstream files contain trailing spaces in JS string literals; JS/CI guards assess behavior.
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "merge: integrate $ref with reviewed source overlaps"
            fi
            # Persist verified merge commits so a failed subsequent merge never discards earlier work.
            git push origin HEAD:codex/integration-all-prs-20261027
            echo "::endgroup::"
          done
          git log -8 --oneline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Regenerate canonical tracked inventories on combined source tree
        run: |
          set -euo pipefail
          node web/scripts/sync-official-scenarios.js
          node web/scripts/build-startup-phase-manifest.js
          node scripts/build-native-preparation-manifest.cjs --write
          node scripts/sync-hot-baseline.js --write
          node web/scripts/build-startup-phase-manifest.js --check
          node scripts/build-native-preparation-manifest.cjs --check
          node scripts/sync-hot-baseline.js --check
          # No broad formatting rewrite of historical prompt strings during feature merge.
      - name: Validate merged source with original repository contracts
        run: |
          set -euo pipefail
          node scripts/verify-release-contract.js
          node web/scripts/lint-arch-all.js
          node web/scripts/ci-smokes.js --jobs 2
      - name: Commit merged tree and validated inventories to integration branch only
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'test: synchronize official tracked inventories for combined PRs'
          fi
          git push origin HEAD:codex/integration-all-prs-20261027
          echo 'Validated integration branch only; main not modified'
